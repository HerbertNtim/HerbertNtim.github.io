title: Learning by Building
description: >
  A blog about machine learning, deep learning, computer vision,
  data science, and software engineering through practical projects.
github_username: HerbertNtim

# Optional contact details
email: herbert15@gmail.com
email: herbert2023@gmail.com
twitter_username: https://x.com/hntim0829

# Enable LaTeX math equation support
use_math: true

# Google Analytics ID (optional)
google_analytics:

# Theme and plugins
theme: minima
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-octicons
  - jekyll-github-metadata

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: katex
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
